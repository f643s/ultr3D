[repository]
name = "ultr3d"
authors = ["f643s", "Samine825"]

[ultr3d]
description = "A new perspective on window management for Hyprland"
authors = ["f643s", "Samine825"]
output = "build/ultr3d.so"
build = ["cmake -S . -B build -DHYPRLAND_HEADERS=/var/cache/hyprpm/\"$USER\"/headersRoot", "cmake --build build -j$(nproc)"]
